name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes a queued one, but a running
# deployment is never cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # current LTS
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The game-data tests are skipped on a clone without the private fixtures (see vite.config.ts).
      - name: Typecheck, lint and test
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_path is "/<repo>" for a project site and "" for a user/custom-domain site.
      - name: Build
        run: pnpm exec vite build --base "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
